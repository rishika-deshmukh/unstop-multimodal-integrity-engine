name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies (ffmpeg & espeak)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak libespeak1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Multimodal Pipeline on Sample Submissions
        run: |
          python run_integrity_check.py --input_dir ./sample_submissions --output_dir ./reports

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: Run Evaluation Benchmark Validation
        run: |
          python evaluate.py
